name: "CI"

on:
  [push, pull_request]

jobs:

  server:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10']

    services:
      redis:
          image: redis:alpine
          ports:
              - "6379:6379"

      mongo:
          image: mongo:6
          ports:
              - "27017:27017"

      elastic:
        image: docker.elastic.co/elasticsearch/elasticsearch:7.17.25
        ports:
            - "9200:9200"
        env:
            discovery.type: single-node

    steps:
      - uses: actions/checkout@v6

      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - run: |
             sudo apt-get update
             sudo apt-get install pkg-config libxml2-dev libxmlsec1-dev libxmlsec1-openssl

      - run: python -m pip install --upgrade pip wheel setuptools
      - run: python -m pip install -r dev-requirements.txt

      - name: pytest
        run: pytest --ignore=tests/aap/ --disable-pytest-warnings --cov=newsroom

      - name: behave (API)
        run: behave --format progress2 --logging-level=ERROR features/news_api

      - name: behave (Web)
        run: behave --format progress2 --logging-level=ERROR features/web_api
      
      - name: behave (MGMT)
        run: behave --format progress2 --logging-level=ERROR features/mgmt_api

  client:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['14', '22']

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: npm install
        run: npm ci || npm install

      - name: lint
        run: npm run lint

      - name: test
        run: npm run test

      - name: build
        run: npm run build
